name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.17+093cb8f9c'
          core-version: '0.10.17+093cb8f9c'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record toolchain
        run: moon version --all
      - name: Formatting
        run: moon fmt --check
      - name: Compile all targets
        run: moon check --target all --deny-warn
      - name: Test all targets
        run: moon test --target all --deny-warn
      - name: Run ingestion example
        run: moon run cmd/demo --target js --deny-warn
      - name: Review generated API
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Core source metric
        run: python scripts/count_loc.py --minimum 4000
      - name: Install independent oracle locally
        run: python -m pip install --target work/pydeps pydlt==0.3.5
      - name: Bidirectional interoperability
        run: python scripts/interop.py
      - name: Seeded independent typed reconstruction
        run: python scripts/test_interop_random.py
      - name: Optimized runtime tests
        run: |
          moon test --target wasm --release --deny-warn
          moon test --target js --release --deny-warn
      - name: Actual file consumer
        run: python scripts/test_file_cli.py
      - name: R19-11 typed Storage edit and independent Rust interoperability
        run: python scripts/test_review_record.py --rust
      - name: R19-11 Classic ARXML to typed nonverbose Storage
        run: python scripts/test_arxml.py
      - name: Mooncakes archive and fresh dependency consumer
        run: python scripts/test_public_package.py
